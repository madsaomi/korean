{% extends 'error_base.html' %}
{% block title %}400 — Неверный запрос{% endblock %}
{% block error_content %}
<div class="error-icon"><i class="bi bi-question-circle"></i></div>
<div class="error-code">400</div>
<div class="error-title">Неверный запрос</div>
<div class="error-desc">Сервер не смог обработать запрос. Проверь правильность введённых данных.</div>
<a href="{% url 'index' %}" class="btn-glass btn-accent"><i class="bi bi-house-fill"></i> На главную</a>
{% endblock %}
