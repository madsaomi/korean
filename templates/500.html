{% extends 'error_base.html' %}
{% block title %}500 — Ошибка сервера{% endblock %}
{% block error_content %}
<div class="error-icon"><i class="bi bi-exclamation-triangle-fill"></i></div>
<div class="error-code">500</div>
<div class="error-title">Что-то пошло не так</div>
<div class="error-desc">На сервере произошла ошибка. Мы уже знаем о проблеме и скоро всё починим.</div>
<a href="{% url 'index' %}" class="btn-glass btn-accent"><i class="bi bi-house-fill"></i> На главную</a>
<br><br>
  <small class="muted small d-block mt-2">Попробуй обновить страницу через пару минут</small>
{% endblock %}
